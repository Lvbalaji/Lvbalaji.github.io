<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | LVB</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #050505;
            --neon-green: #00ff41;
            --neon-purple: #bd00ff;
            --text-main: #e0e0e0;
            --code-bg: #111;
            --grid-color: rgba(0, 255, 65, 0.05);
        }

        /* 1. GLOBAL CURSOR RESET: Hides default mouse */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            line-height: 1.6;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* 2. CUSTOM CURSOR STYLES */
        .cursor {
            width: 20px; height: 20px;
            border: 2px solid var(--neon-green);
            border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 9999;
            transition: transform 0.1s;
        }
        .cursor-dot {
            width: 6px; height: 6px; background: var(--neon-green);
            border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999;
        }

        /* --- Navbar --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 5%; backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(0, 255, 65, 0.1);
            background: rgba(5, 5, 5, 0.8);
        }
        .brand { 
            font-family: 'JetBrains Mono', monospace; color: var(--neon-green); 
            font-weight: bold; font-size: 1.2rem; text-decoration: none;
        }
        .nav-links a { color: #fff; text-decoration: none; margin-left: 20px; font-weight: 500; transition: 0.3s; }
        .nav-links a:hover { color: var(--neon-green); }

        /* --- Blog Container --- */
        .blog-container {
            max-width: 900px; margin: 60px auto; padding: 0 20px;
        }

        /* --- Header Section --- */
        .post-header { margin-bottom: 50px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 30px; }
        
        .meta-tags { 
            font-family: 'JetBrains Mono'; font-size: 0.85rem; color: var(--neon-purple); 
            margin-bottom: 15px; display: flex; gap: 15px;
        }
        
        h1 {
            font-size: 3rem; font-weight: 800; margin-bottom: 20px; line-height: 1.2;
            background: linear-gradient(to right, #fff, #a5a5a5);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* --- Content Styling --- */
        
        /* Headers */
        .content h2 { 
            font-size: 1.8rem; margin-top: 50px; margin-bottom: 20px; 
            color: #fff; border-left: 4px solid var(--neon-green); padding-left: 15px;
        }
        .content h3 { font-size: 1.4rem; margin-top: 30px; margin-bottom: 15px; color: var(--neon-green); }

        /* Text */
        .content p { margin-bottom: 20px; font-size: 1.05rem; color: #ccc; }
        .content strong { color: #fff; font-weight: 700; }
        .content ul, .content ol { margin-left: 20px; margin-bottom: 20px; color: #ccc; }
        .content li { margin-bottom: 10px; }

        /* Code Blocks */
        .content pre {
            background: var(--code-bg); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px; padding: 20px; margin: 25px 0; overflow-x: auto;
            position: relative;
        }
        .content pre::before {
            content: 'TERMINAL'; position: absolute; top: 0; left: 0;
            background: #222; color: #777; font-size: 0.7rem; 
            padding: 2px 10px; border-bottom-right-radius: 5px; font-family: 'JetBrains Mono';
        }
        .content code { font-family: 'JetBrains Mono', monospace; color: var(--neon-green); font-size: 0.9rem; }

        /* --- Image Styling Fix --- */
        .content img {
            max-width: 100%;       /* Forces image to fit inside the container */
            height: auto;          /* Maintains aspect ratio (prevents stretching) */
            display: block;        /* Allows centering */
            margin: 30px auto;     /* Centers image with space above/below */
            border-radius: 10px;   /* Smooth corners */
            border: 1px solid rgba(0, 255, 65, 0.2); /* Subtle neon border */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); /* Deep shadow for depth */
            transition: transform 0.3s ease; /* smooth hover effect */
        }

        /* Optional: Slight zoom on hover for a "scan" effect */
        .content img:hover {
            transform: scale(1.02);
            border-color: var(--neon-green);
        }

        /* Tables */
        .content table { 
            width: 100%; border-collapse: collapse; margin: 30px 0; 
            background: rgba(255, 255, 255, 0.03); border-radius: 10px; overflow: hidden;
        }
        .content th { background: rgba(0, 255, 65, 0.1); color: var(--neon-green); padding: 15px; text-align: left; font-family: 'JetBrains Mono'; }
        .content td { padding: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); color: #ddd; }

        /* Blockquotes (Styled as Interview Boxes) */
        .content blockquote {
            background: rgba(189, 0, 255, 0.05); border-left: 3px solid var(--neon-purple);
            border-radius: 5px; padding: 20px; margin: 30px 0;
            color: #ddd; font-style: normal;
        }

        /* --- Back Button --- */
        .btn-back {
            display: inline-block; margin-bottom: 20px; color: var(--neon-green); text-decoration: none; 
            font-family: 'JetBrains Mono'; border: 1px solid var(--neon-green); padding: 10px 20px; border-radius: 5px;
            transition: 0.3s;
        }
        .btn-back:hover { background: var(--neon-green); color: #000; }

        /* --- Footer --- */
        .footer { text-align: center; padding: 50px; color: #555; font-family: 'JetBrains Mono'; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="cursor" id="cursor"></div>
    <div class="cursor-dot" id="cursor-dot"></div>

    <nav>
        <a href="{{ site.baseurl }}/" class="brand">&lt;LVB&gt;</a>
        <div class="nav-links">
            <a href="{{ site.baseurl }}/">Mission Control</a>
            <a href="{{ site.baseurl }}/all-writeups.html">Archives</a>
        </div>
    </nav>

    <div class="blog-container">
        <a href="{{ site.baseurl }}/" class="btn-back"><i class="fas fa-arrow-left"></i> Return to Base</a>

        <header class="post-header">
            <div class="meta-tags">
                <span><i class="fas fa-calendar"></i> {{ page.date | date: "%Y-%m-%d" }}</span>
                {% if page.categories %}
                <span><i class="fas fa-tag"></i> {{ page.categories | join: ", " }}</span>
                {% endif %}
            </div>
            <h1>{{ page.title }}</h1>
        </header>

        <div class="content">
            {{ content }}
        </div>

        <hr style="border-color: rgba(255,255,255,0.1); margin: 50px 0;">
        
        <p style="text-align: center; color: #777;">
            <i class="fas fa-check-circle" style="color: var(--neon-green)"></i> END OF LOG
        </p>
    </div>

    <div class="footer">
        SYSTEM STATUS: ONLINE // COPYRIGHT 2026 LVB
    </div>

    <script>
        const cursor = document.getElementById('cursor');
        const cursorDot = document.getElementById('cursor-dot');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursorDot.style.left = e.clientX + 'px';
            cursorDot.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
